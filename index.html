<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lightweight</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201024%201024%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231c2028%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230b0d10%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%221024%22%20height%3D%221024%22%20rx%3D%22224%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20fill%3D%22%23c6f432%22%3E%3Crect%20x%3D%22150%22%20y%3D%22372%22%20width%3D%2270%22%20height%3D%22280%22%20rx%3D%2226%22/%3E%3Crect%20x%3D%22236%22%20y%3D%22312%22%20width%3D%2292%22%20height%3D%22400%22%20rx%3D%2232%22/%3E%3Crect%20x%3D%22696%22%20y%3D%22312%22%20width%3D%2292%22%20height%3D%22400%22%20rx%3D%2232%22/%3E%3Crect%20x%3D%22804%22%20y%3D%22372%22%20width%3D%2270%22%20height%3D%22280%22%20rx%3D%2226%22/%3E%3C/g%3E%3Cpolyline%20points%3D%22350%2C512%20430%2C512%20470%2C420%20530%2C610%20575%2C470%20605%2C512%20674%2C512%22%20fill%3D%22none%22%20stroke%3D%22%230b0d10%22%20stroke-width%3D%2262%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%3Cpolyline%20points%3D%22350%2C512%20430%2C512%20470%2C420%20530%2C610%20575%2C470%20605%2C512%20674%2C512%22%20fill%3D%22none%22%20stroke%3D%22%23c6f432%22%20stroke-width%3D%2234%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E%0A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Lightweight">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0e1013;--card:#171a20;--card2:#20242c;--line:#2a2f39;--tx:#eef1f5;--mu:#8b93a3;--ac:#c6f432;--blue:#4fc3f7;--warn:#ff8a5c;--pur:#b39dff;--pink:#ff7eb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.lock{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,19,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
.ttl{font-size:21px;font-weight:750;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--mu)}
.icon{background:var(--card2);border:1px solid var(--line);color:var(--tx);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.icon svg{width:20px;height:20px}
.dnav{display:flex;gap:8px;align-items:center;max-width:640px;margin:10px auto 0}
.dnav button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;height:36px;min-width:44px;font-size:18px}
.dnav button:disabled{opacity:.35}
.dnav .dlabel{flex:1;font-size:15px;font-weight:600}
#banner{max-width:640px;margin:8px auto 0;font-size:12.5px;color:#ffd7a8;background:#2b2116;border:1px solid #4a3620;border-radius:10px;padding:7px 10px;display:none}
main{padding:12px 12px calc(92px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac)}
nav svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
h3{margin:0;font-size:16px;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.big{font-size:28px;font-weight:750;letter-spacing:-.5px}
.big small{font-size:14px;color:var(--mu);font-weight:500}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:22px;font-weight:750;margin-top:2px}
.stat .v small{font-size:12px;color:var(--mu);font-weight:500}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
label.f{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input,select,textarea{font:inherit;font-size:16px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#4a5363}
textarea{resize:vertical;min-height:64px}
input[type=date],input[type=time]{min-height:44px;-webkit-appearance:none;appearance:none;min-width:0;width:100%;display:block;text-align:left}
.grid2>*,.grid3>*{min-width:0}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#12160a;border:0;border-radius:12px;padding:11px 16px;font-weight:700;white-space:nowrap}
.btn:disabled{opacity:.5}
.btn2{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 14px;white-space:nowrap}
.btn.full,.btn2.full{width:100%}
.danger{color:#ff8f8f!important;border-color:#5a2a2a!important}
.lnk{background:none;border:0;color:var(--blue);padding:4px 0;font-size:14px}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.macro{display:grid;grid-template-columns:62px 1fr 78px;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.macro span:last-child{text-align:right;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--ac);color:#12160a;border-color:var(--ac);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .chip{text-align:center;padding:8px 0}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.it .main{flex:1;min-width:0}
.it .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sm{font-size:12.5px;color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:13px;padding:6px 4px;white-space:nowrap}
.pill{font-size:11.5px;background:#26310f;color:var(--ac);padding:3px 8px;border-radius:999px}
.cups{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cup{width:22px;height:28px;border:2px solid #355566;border-radius:3px 3px 7px 7px}
.cup.full{background:var(--blue);border-color:var(--blue)}
.empty{color:var(--mu);font-size:13.5px;padding:6px 0}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:#262b34;stroke-width:1}
.chart .yl{fill:#7a8292;font-size:10px;text-anchor:end}
.chart .xl{fill:#7a8292;font-size:10px}
.chart .goal{stroke:var(--ac);stroke-width:1;stroke-dasharray:5 4;opacity:.7}
.chart .gt{fill:var(--ac);font-size:10px;text-anchor:end}
.chart .tl{stroke:#9aa3b2;stroke-width:1;stroke-dasharray:4 4}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.open{display:block}
#modal .back{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#modal .sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:#13161b;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:-14px;background:#13161b;padding:6px 0;z-index:2}
.sh b{font-size:18px}
.sec{margin-top:14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.exh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exh b{font-size:16px}
.sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets th{font-size:11px;color:var(--mu);font-weight:600;text-align:left;padding:2px 4px;text-transform:uppercase}
.sets td{padding:3px 4px}
.sets input{padding:8px 8px;text-align:center}
.sets td.n{color:var(--mu);width:24px;text-align:center}
.sets td.e{font-size:12px;color:var(--mu);width:52px;text-align:center}
.timer{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.timer #tmr{flex:1;font-weight:700;font-variant-numeric:tabular-nums;padding-left:4px}
.timer #tmr.done{color:var(--ac)}
.timer button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 8px;font-size:13px}
.ai{background:linear-gradient(180deg,#1b1f28,#171a20);border:1px solid #333a48;border-radius:14px;padding:12px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:100px}
.note{font-size:12.5px;color:var(--mu);margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2a303b;color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px;align-items:baseline}
.pr .h{font-size:11px;color:var(--mu);text-transform:uppercase}
.pr .r{text-align:right;font-variant-numeric:tabular-nums}
.prog{height:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;display:block;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #2a2f39}
.logo svg{width:100%;height:100%;display:block}
.ttl{font-size:19px;font-weight:850;letter-spacing:1.5px}
nav button{font-size:10.5px}
/* crew */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--card2);display:grid;place-items:center;font-weight:750;color:var(--ac);border:1px solid var(--line);font-size:15px}
.av.lg{width:64px;height:64px;font-size:22px}
.rank{width:22px;text-align:center;color:var(--mu);font-weight:700}
.rank.r1{color:#ffd54a}.rank.r2{color:#cfd8dc}.rank.r3{color:#e0a26e}
.val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.val small{display:block;font-size:11px;color:var(--mu);font-weight:500}
.swipe{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.swipe::-webkit-scrollbar{display:none}
.swipe .ph{flex:0 0 82%;scroll-snap-align:center;position:relative;border-radius:14px;overflow:hidden;background:var(--card2);aspect-ratio:4/5}
.swipe.full .ph{flex-basis:100%}
.swipe .ph img{width:100%;height:100%;object-fit:cover;display:block}
.swipe .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:14px}
.swipe .cap b{display:block;font-size:13px;color:var(--ac)}
.swipe .del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:0;color:#fff;border-radius:999px;padding:6px 10px;font-size:13px}
.preview{width:100%;max-height:50vh;object-fit:contain;border-radius:12px;background:#000}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kv div{background:var(--card2);border-radius:10px;padding:8px 2px}
.kv b{display:block;font-size:19px}
.kv span{font-size:10.5px;color:var(--mu)}
#login{display:none}
body.signedout #login{display:block}
body.signedout header,body.signedout main,body.signedout nav{display:none}
.lg-wrap{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 22px 40px}
.lg-logo{width:88px;height:88px;border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:0 0 0 1px #2a2f39}
.lg-logo svg{width:100%;height:100%;display:block}
.lg-t{font-size:28px;font-weight:850;letter-spacing:2px;margin-bottom:6px}
.steps{margin:0;padding-left:22px;font-size:16px;line-height:1.5}.steps li{margin-bottom:10px}.shr{display:inline-block;background:var(--card2);border-radius:6px;padding:0 6px}
.lg-err{margin-top:12px;color:#ffb4a0;background:#2b1a16;border:1px solid #4a2a20;border-radius:10px;padding:9px 11px;font-size:14px}
.lg-ph{width:96px;height:96px;border-radius:50%;background:var(--card2);border:2px dashed #3a4150;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;position:relative;overflow:hidden;color:var(--ac);cursor:pointer}
.lg-ph span{font-size:30px;line-height:1}.lg-ph small{font-size:11px;color:var(--mu)}
.lg-ph img{width:100%;height:100%;object-fit:cover}
.lg-ph input{position:absolute;inset:0;opacity:0}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.part{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px}
.part svg{width:34px;height:52px}
.part.on{border-color:var(--ac);background:#232b12}
.part.on span{color:var(--ac);font-weight:700}
.sb{background:radial-gradient(120% 80% at 50% 0%,#24301a 0%,#171a20 55%);border-color:#2f3a22}
.sbh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.sbk{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ac);font-weight:800}
.sbt{font-size:22px;font-weight:850;letter-spacing:-.3px}
.sbn{font-size:12px;color:var(--mu);background:#0e1013aa;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.seg{display:flex;gap:4px;background:#0e1013;border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;background:none;border:0;color:var(--mu);font-size:12.5px;font-weight:650;padding:8px 10px;border-radius:9px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#12160a}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:22px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;position:relative}
.pod.empty{visibility:hidden}
.crown{font-size:24px;margin-bottom:-4px;filter:drop-shadow(0 2px 6px #ffd54a88)}
.pav{position:relative}
.pav .av.lg{width:58px;height:58px;font-size:22px;border:2px solid #3a4150}
.p1 .pav .av.lg{width:78px;height:78px;font-size:28px;border:3px solid #ffd54a;box-shadow:0 0 22px #ffd54a55}
.p2 .pav .av.lg{border-color:#cfd8dc}
.p3 .pav .av.lg{border-color:#e0a26e}
.pbadge{position:absolute;bottom:-4px;right:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:850;color:#12160a;background:#cfd8dc;border:2px solid #171a20}
.p1 .pbadge{background:#ffd54a}.p3 .pbadge{background:#e0a26e}
.pname{font-weight:750;font-size:14px;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pval{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.1}
.p1 .pval{font-size:32px;color:var(--ac)}
.pval small{font-size:11px;color:var(--mu);font-weight:600;margin-left:3px}
.pfire{font-size:12px;color:#ffb067;margin-top:2px}
.pstep{width:100%;margin-top:8px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#2a3140,#1c2029);color:#5d6678;font-weight:900;font-size:18px;display:grid;place-items:center}
.p1 .pstep{height:64px;background:linear-gradient(180deg,#3f4d17,#232b12);color:var(--ac)}
.p2 .pstep{height:44px}.p3 .pstep{height:30px}
.you{font-size:10.5px;background:#232b12;color:var(--ac);border-radius:999px;padding:1px 6px;vertical-align:middle;font-weight:700}
.fire{font-size:12px;color:#ffb067}
.sbl{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
.sbar{height:5px;background:var(--card2);border-radius:4px;margin:5px 0 3px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#7d9a1f,var(--ac));border-radius:4px}
html,body{overscroll-behavior-y:none}
main{min-height:calc(100vh - 60px)}
.mebtn{background:none;border:0;padding:0;display:block;border-radius:50%}
.mebtn .av{width:40px;height:40px;border:2px solid var(--ac)}
main > .card:not(.sb):not(.ai){--c:198,244,50;background:radial-gradient(130% 90% at 0% 0%,rgba(var(--c),.30) 0%,rgba(var(--c),.10) 45%,#15181e 80%);border:1.5px solid rgba(var(--c),.45);box-shadow:0 8px 24px -12px rgba(var(--c),.45)}
main > .card:not(.sb):not(.ai) h3{color:rgb(var(--c))}
main > .card:not(.sb):not(.ai):nth-of-type(5n+2){--c:79,195,247}
main > .card:not(.sb):not(.ai):nth-of-type(5n+3){--c:52,211,153}
main > .card:not(.sb):not(.ai):nth-of-type(5n+4){--c:179,157,255}
main > .card:not(.sb):not(.ai):nth-of-type(5n+5){--c:255,138,92}
.fthumb{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:0 0 auto;border:1px solid var(--line)}
.scan{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-weight:650;color:var(--ac)}
.spin{width:18px;height:18px;border:2.5px solid #3a4150;border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.voice{display:block;width:100%;text-align:center;background:linear-gradient(180deg,#2a3512,#1c2210);border:1.5px solid #4d6420;border-radius:18px;padding:18px 14px;color:var(--tx)}
.voice.on{background:linear-gradient(180deg,#4a1f1a,#2a1412);border-color:#ff6b5c;animation:pulse 1.2s infinite}
.voice.busy{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--ac)}
.vmic{display:block;font-size:40px;line-height:1.1}
.vt{display:block;font-size:19px;font-weight:800;margin-top:4px}

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const DAY = 86400000;
const dnum = s => parseYmd(s).getTime();
const fmtDate = (s, o) => parseYmd(s).toLocaleDateString(undefined, o || {weekday:'short', month:'short', day:'numeric'});
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round = (n, d=0) => { const p = 10**d; return Math.round(n*p)/p; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString();
const uid36 = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const e1rm = (w, r) => (w > 0 && r > 0) ? (r === 1 ? w : w * (1 + r/30)) : 0;
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts||0) - (b.ts||0);

const DEFAULTS = {startWeight:215, goalWeight:170, calTarget:2200, proteinTarget:180, waterTarget:8, sleepTarget:7.5, stepsTarget:8000, customExercises:[]};
const PRESET = ['Deadlift','Squat','Bench Press','Overhead Press','Barbell Row','Romanian Deadlift','Front Squat','Incline Bench Press','Pull-up','Chin-up','Lat Pulldown','Seated Cable Row','Dumbbell Bench Press','Dumbbell Shoulder Press','Dumbbell Row','Leg Press','Lunge','Bulgarian Split Squat','Leg Curl','Leg Extension','Hip Thrust','Bicep Curl','Hammer Curl','Tricep Pushdown','Skull Crusher','Dips','Face Pull','Lateral Raise','Shrug','Calf Raise','Farmer Carry','Plank','Back Extension'];
const BIG = ['Deadlift','Squat','Bench Press','Overhead Press'];
const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];

const ICON = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6v12M17.5 6v12M3 9v6M21 9v6M6.5 12h11"/></svg>',
  food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2M18 22V2c-2.5 1.5-4 4.5-4 8.5 0 1.5.8 2.5 2 2.5h2"/></svg>',
  body:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  prog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>'
};
ICON.crew = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5.4"/></svg>';
const LOGO = '<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2028"/><stop offset="1" stop-color="#0b0d10"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#lg)"/><g fill="#c6f432"><rect x="150" y="372" width="70" height="280" rx="26"/><rect x="236" y="312" width="92" height="400" rx="32"/><rect x="696" y="312" width="92" height="400" rx="32"/><rect x="804" y="372" width="70" height="280" rx="26"/></g><polyline points="350,512 430,512 470,420 530,610 575,470 605,512 674,512" fill="none" stroke="#0b0d10" stroke-width="62" stroke-linejoin="round" stroke-linecap="round"/><polyline points="350,512 430,512 470,420 530,610 575,470 605,512 674,512" fill="none" stroke="#c6f432" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"/></svg>';
const TABS = [['today','Today','today'],['lift','Workout','lift'],['food','Food','food'],['body','Weight & Sleep','body'],['prog','Progress','prog'],['crew','Crew','crew']];
const NAVLBL = {today:'Today', lift:'Workout', food:'Food', body:'Body', prog:'Progress', crew:'Crew'};

/* ---------- state ---------- */
const S = { docs:new Map(), tab:'today', date:today(), mode:'loading', col:null, sample:null, sampleImages:false, loaded:false, dirty:false, modal:null, progEx:null, sq:0, sqDate:null,
  db:null, uid:null, assets:null, crew:new Map(), pics:new Map(), picSubs:{}, crewLoaded:false, crewErr:false, crewMetric:'gym', memberId:null, joinAvatar:null, joinAvatarUrl:null, pic:null, busy:false };
function all(kind){ const out = []; for (const [id, d] of S.docs) if (d && d.kind === kind) out.push({...d, id}); return out; }
const settings = () => ({...DEFAULTS, ...(S.docs.get('settings') || {})});
const dayDoc = d => ({kind:'daily', date:d, ...(S.docs.get('d_'+d) || {})});
function sumFood(list){ return list.reduce((t,f)=>({cal:t.cal+num(f.cal), p:t.p+num(f.p), c:t.c+num(f.c), f:t.f+num(f.f)}), {cal:0,p:0,c:0,f:0}); }
function exNames(){ const s = settings(); return [...new Set([...PRESET, ...(s.customExercises||[])])]; }

/* ---------- storage ---------- */
const LSKEY = 'ht_local_v1';
function loadLocal(){ try { const o = JSON.parse(localStorage.getItem(LSKEY) || '{}'); S.docs = new Map(Object.entries(o)); } catch(e) {} }
function saveLocal(){ try { localStorage.setItem(LSKEY, JSON.stringify(Object.fromEntries(S.docs))); } catch(e) {} }
const chains = {}, timers = {}, pending = {};
function put(id, data, delay = 0){
  data = JSON.parse(JSON.stringify({...data, updated: Date.now()}));
  S.docs.set(id, data); scheduleRender(); scheduleCrewSync();
  if (S.mode !== 'cloud') { saveLocal(); return; }
  pending[id] = {op:'set', data};
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), delay);
}
function del(id){
  S.docs.delete(id); scheduleRender(); scheduleCrewSync();
  if (S.mode !== 'cloud') { saveLocal(); return; }
  pending[id] = {op:'del'}; clearTimeout(timers[id]); flush(id);
}
function flush(id){
  const job = pending[id]; if (!job) return;
  const ref = S.col.doc(id);
  chains[id] = (chains[id] || Promise.resolve()).then(() => job.op === 'set' ? ref.set(job.data) : ref.delete())
    .then(() => { if (pending[id] === job) delete pending[id]; })
    .catch(e => {
      if (pending[id] === job) delete pending[id];
      console.error(e);
      toast(e && e.code === 'quota_exceeded' ? 'Storage is full — delete some old entries.' : 'Couldn’t save that — check your connection.');
    });
}
function flushAll(){ for (const id in timers) { clearTimeout(timers[id]); flush(id); } }
window.addEventListener('pagehide', flushAll);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });

async function init(){
  readImportHash();
  renderNav();
  try { localStorage.removeItem('ht_local_v1_unused'); } catch(e) {}
  if (!window.supabase || !window.supabase.createClient) { S.mode = 'local'; loadLocal(); banner('Couldn’t reach the server — saving on this phone only for now.'); render(); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'lw-auth'}});
  const {data} = await sb.auth.getSession();
  if (data && data.session) startApp(data.session); else showLogin();
}
function startApp(session){
  document.body.classList.remove('signedout'); $('#login').innerHTML = '';
  const uid = session.user.id;
  S.myName = S.myName || (session.user.user_metadata && session.user.user_metadata.name) || '';
  S.mode = 'cloud'; S.uid = uid; S.db = makeDb(); S.col = S.db.collection('data/users/' + uid);
  S.assets = assetsApi; S.sample = aiApi; S.sampleImages = true;
  render();
  startCrew();
  const t = setTimeout(() => { if (!S.loaded) banner('Can’t reach your saved data yet — check your connection.'); }, 10000);
  S.col.onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
    for (const id in pending) { const j = pending[id]; if (j.op === 'set') m.set(id, j.data); else m.delete(id); }
    S.docs = m;
    const first = !S.loaded; S.loaded = true; clearTimeout(t); banner('');
    if (first) setTimeout(mergeDayDupes, 600);
    if (first && S.pendingImport) setTimeout(() => openModal('importOld'), 300);
    scheduleRender(); scheduleCrewSync();
  }, err => { clearTimeout(t); S.loaded = true; banner('Couldn’t load your data. Check your connection and reopen the app.'); scheduleRender(); });
}

/* ---------- Supabase backend ---------- */
const SB_URL = 'https://tdjkqpddnfvianryscyj.supabase.co';
const SB_KEY = 'sb_publishable_LswsTQCQyFtU6m_b5vIhiw_xXIDtv6m';
const BUCKET = 'lw-photos';
let sb = null;
const pubUrl = p => `${SB_URL}/storage/v1/object/public/${BUCKET}/${String(p).split('/').map(encodeURIComponent).join('/')}`;
const sbErr = e => { const x = new Error((e && e.message) || 'error'); x.code = (e && /quota|limit/i.test(e.message || '')) ? 'quota_exceeded' : 'unavailable'; return x; };

function makeDb(){
  const listeners = {lw_docs:new Set(), lw_crew:new Set(), lw_pics:new Set()};
  async function fetchTable(table){
    const out = [];
    for (let from = 0; ; from += 1000) {
      let q = sb.from(table).select('*').range(from, from + 999);
      if (table === 'lw_docs') q = q.eq('user_id', S.uid);
      if (table === 'lw_pics') q = q.order('ts', {ascending:false});
      const {data, error} = await q; if (error) throw sbErr(error);
      out.push(...data); if (data.length < 1000) break;
    }
    return out;
  }
  async function refresh(table){
    if (!listeners[table].size) return;
    try { const rows = await fetchTable(table); listeners[table].forEach(l => l.ok(rows)); }
    catch(e) { listeners[table].forEach(l => l.fail && l.fail(e)); }
  }
  const snap = docs => ({docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false, hasPendingWrites:false}});
  const dsnap = (id, data) => ({id, exists:true, data:() => data, metadata:{fromCache:false}});
  function listen(table, map, cb, err){
    const l = {ok: rows => cb(snap(map(rows))), fail: err};
    listeners[table].add(l); refresh(table);
    return () => listeners[table].delete(l);
  }
  function docRef(path){
    const s = path.split('/');
    if (s[0] === 'data' && s.length === 4) return {
      set: async d => { const {error} = await sb.from('lw_docs').upsert({user_id:S.uid, id:s[3], data:d, updated_at:new Date().toISOString()}); if (error) throw sbErr(error); },
      delete: async () => { const {error} = await sb.from('lw_docs').delete().eq('user_id', S.uid).eq('id', s[3]); if (error) throw sbErr(error); }
    };
    if (s[0] === 'crew' && s.length === 2) return {
      set: async d => { const {error} = await sb.from('lw_crew').upsert({user_id:S.uid, data:d, updated_at:new Date().toISOString()}); if (error) throw sbErr(error); refresh('lw_crew'); },

/* ---------- charts ---------- */
function lineChart(series, {goal=null, h=170}={}){
  const W = 340, H = h, L = 34, R = 10, T = 12, B = 22;
  const pts = series.flatMap(s => s.pts);
  if (!pts.length) return '<div class="empty">No data yet.</div>';
  let x0 = Math.min(...pts.map(p=>p.x)), x1 = Math.max(...pts.map(p=>p.x));
  if (x1 - x0 < DAY*2) { x0 -= DAY*3; x1 += DAY*3; }
  const ys = pts.map(p=>p.y); if (goal != null) ys.push(goal);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pd = (y1-y0)*0.12 || 2; y0 -= pd; y1 += pd;
  const sx = x => L + (x-x0)/(x1-x0)*(W-L-R), sy = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1-y0)*i/3, y = sy(v).toFixed(1); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-5}" y="${+y+3.5}" class="yl">${Math.round(v)}</text>`; }
  if (goal != null) { const y = sy(goal).toFixed(1); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="goal"/><text x="${W-R}" y="${y-4}" class="gt">goal ${goal}</text>`; }
  for (const s of series) {
    if (!s.pts.length) continue;
    const d = s.pts.map((p,i) => `${i?'L':'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
    if (s.pts.length > 1) g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.op||1}"/>`;
    if (s.dots) g += s.pts.map(p => `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${s.r||2.6}" fill="${s.color}" opacity="${s.op||1}"/>`).join('');
  }
  const lab = x => new Date(x).toLocaleDateString(undefined, {month:'short', day:'numeric'});
  g += `<text x="${L}" y="${H-5}" class="xl">${lab(x0)}</text><text x="${W-R}" y="${H-5}" class="xl" text-anchor="end">${lab(x1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>`;
}
function barChart(items, {target=null, color='var(--ac)', h=140, overWarn=false, dec=0}={}){
  const W = 340, H = h, L = 34, R = 6, T = 10, B = 20;
  const max = (Math.max(target || 0, ...items.map(i => i.v)) * 1.12) || 1;
  const bw = (W-L-R)/items.length, sy = v => H-B-(v/max)*(H-T-B);
  let g = `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" class="gl"/><text x="${L-5}" y="${H-B+3}" class="yl">0</text>`;
  items.forEach((it, i) => {
    const x = L + i*bw + bw*0.17, w = bw*0.66, y = sy(it.v), hh = H-B-y;
    const c = overWarn && target && it.v > target ? 'var(--warn)' : color;
    if (it.v > 0) g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh,1).toFixed(1)}" rx="3" fill="${c}"/>`;
    if (items.length <= 8 || i % 2 === (items.length-1) % 2) g += `<text x="${(x+w/2).toFixed(1)}" y="${H-5}" class="xl" text-anchor="middle">${esc(it.label)}</text>`;
  });
  if (target) { const y = sy(target).toFixed(1); g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="tl"/><text x="${L-5}" y="${+y+3.5}" class="yl">${round(target,dec)}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>`;
}

  { const nm = napMin(d), tot = sleepTotal(d);

  const off = !!(S.docs.get('d_'+d) || {}).off && !wos.length;

  if (off) h += `<div class="restmsg">😴 Rest day — recovery counts too.</div>`;

  h += wos.length ? `<button class="btn full" style="margin-top:8px" data-a="newWo">Continue workout</button></div>`

    : `<div class="grid2" style="margin-top:8px"><button class="btn" data-a="newWo">Start workout</button><button class="btn2" data-a="offDay">😴 Rest day</button></div></div>`;
  h += calendarCard(d.slice(0, 7), false);

  return h;
};

VIEWS.food = () => {
  const st = settings(), d = S.date;
  const foods = all('food').filter(f => f.date === d).sort((a,b) => (a.ts||0) - (b.ts||0));
  const tot = sumFood(foods);
  let h = `<div class="card"><div class="ch"><div><div class="big">${fmt(tot.cal)}<small> / ${fmt(st.calTarget)} cal</small></div></div><span class="mu">${tot.cal <= st.calTarget ? fmt(st.calTarget - tot.cal) + ' left' : fmt(tot.cal - st.calTarget) + ' over'}</span></div>
    ${bar(tot.cal, st.calTarget, 'var(--ac)', true)}
    <div class="macro"><span>Protein</span>${bar(tot.p, st.proteinTarget, 'var(--pink)')}<span>${fmt(tot.p)} / ${fmt(st.proteinTarget)} g</span></div>
    <div class="note">Carbs ${fmt(tot.c)} g · Fat ${fmt(tot.f)} g</div></div>`;
  const shots = foods.filter(f => f.photo);
  if (shots.length) h += `<div class="card"><div class="ch"><h3>${d === today() ? 'Today’s plates' : 'Plates'}</h3><span class="mu">${shots.length} photo${shots.length > 1 ? 's' : ''}</span></div>
    <div class="plates">${shots.map(f => `<div class="plate tap" data-a="editFood" data-id="${esc(f.id)}"><img src="${blobUrl(f.photo)}" alt="" loading="lazy"><div class="pc"><b>${esc(f.meal || '')}</b>${fmt(num(f.cal))} cal</div></div>`).join('')}</div></div>`;
  for (const m of MEALS) {
    const items = foods.filter(f => (f.meal || 'Snacks') === m), t = sumFood(items);
    h += `<div class="card"><div class="ch"><h3>${m}</h3><div class="row"><span class="mu">${items.length ? fmt(t.cal) + ' cal' : ''}</span><label class="btn2 filebtn">📷 Photo<input type="file" accept="image/*" data-file="mealpic" data-meal="${m}"></label></div></div>`;
    h += items.length ? `<div class="list">${items.map(f => `<div class="it">${f.photo ? `<img class="fthumb" src="${blobUrl(f.photo)}" alt="" loading="lazy">` : ''}<div class="main tap" data-a="editFood" data-id="${esc(f.id)}"><div class="nm">${esc(f.name)}</div><div class="sm">${fmt(num(f.cal))} cal · P ${fmt(num(f.p))} · C ${fmt(num(f.c))} · F ${fmt(num(f.f))}</div></div><button class="x" data-a="delDoc" data-id="${esc(f.id)}">Remove</button></div>`).join('')}</div>` : '';
    h += `</div>`;
  }
  // photo diary: every day with meal photos, photos overlapping
  const byDay = {}; all('food').filter(f => f.photo).forEach(f => (byDay[f.date] = byDay[f.date] || []).push(f));
  const pdays = Object.keys(byDay).sort().reverse().slice(0, 21);
  if (pdays.length) h += `<div class="card"><div class="ch"><h3>Photo diary</h3><span class="mu">tap a day</span></div><div class="list">${pdays.map(dd => { const fs = byDay[dd].sort((a, b) => (a.ts || 0) - (b.ts || 0)), tot = sumFood(all('food').filter(f => f.date === dd));
    return `<div class="it tap ${dd === d ? 'pdsel' : ''}" data-a="foodDay" data-v="${dd}"><div class="stack">${fs.slice(0, 4).map((f, i) => `<img src="${blobUrl(f.photo)}" alt="" loading="lazy" style="z-index:${10 - i}">`).join('')}${fs.length > 4 ? `<span>+${fs.length - 4}</span>` : ''}</div><div class="main"><div class="nm">${dd === today() ? 'Today' : fmtDate(dd)}</div><div class="sm">${fmt(tot.cal)} cal · ${fmt(tot.p)} g protein</div></div><span class="mu">›</span></div>`; }).join('')}</div></div>`;
  // recents
  const cut = addDays(today(), -45), seen = new Set(), rec = [];
  all('food').filter(f => f.date >= cut).sort((a,b) => (b.ts||0) - (a.ts||0)).forEach(f => { const k = (f.name||'').trim().toLowerCase(); if (k && !seen.has(k) && rec.length < 16) { seen.add(k); rec.push(f); } });
  if (rec.length) h += `<div class="card"><div class="ch"><h3>Quick add</h3><span class="mu">Adds to ${guessMeal()}</span></div><div class="chips">${rec.map(f => `<button class="chip" data-a="quickFood" data-id="${esc(f.id)}">${esc(f.name)} <span class="mu">${fmt(num(f.cal))}</span></button>`).join('')}</div></div>`;
  return h;
};

    ${napsOf(d).length ? `<div class="chips" style="margin-top:8px">${napsOf(d).map((n, i) => `<button class="chip napc" data-a="rmNap" data-i="${i}">😴 ${minTxt(num(n.m))} ✕</button>`).join('')}</div>` : ''}</div>
    <button class="btn full" style="margin-top:12px" data-a="saveSleep">${sl ? 'Update' : 'Save'} sleep</button>

VIEWS.prog = () => {
  const st = settings(), t = today();
  const ws = all('weight').filter(w => num(w.lbs) > 0).sort(byDate);
  const cur = ws[ws.length-1];
  let h = '';
  // weight
  const lost = cur ? round(st.startWeight - num(cur.lbs), 1) : 0;
  const toGo = cur ? round(num(cur.lbs) - st.goalWeight, 1) : null;
  const span = st.startWeight - st.goalWeight;
  const pct = cur && span > 0 ? clamp((st.startWeight - num(cur.lbs)) / span * 100, 0, 100) : 0;
  const rate = weeklyRate(ws);
  let proj = '';
  if (rate !== null && toGo > 0) {
    if (rate < -0.05) { const days = toGo / (-rate/7); proj = `At this pace you reach ${st.goalWeight} lb around <b>${fmtDate(addDays(t, Math.round(days)), {month:'short', day:'numeric', year:'numeric'})}</b>.`; }
    else proj = 'Weight isn’t trending down over the last 4 weeks.';
  }
  const cut = addDays(t, -90), recent = ws.filter(w => w.date >= cut);
  const avgPts = recent.map(w => { const lo = addDays(w.date, -6); const win = ws.filter(x => x.date >= lo && x.date <= w.date); return {x:dnum(w.date), y:win.reduce((a,b)=>a+num(b.lbs),0)/win.length}; });
  h += `<div class="card"><div class="ch"><h3>Weight</h3><span class="mu">Last 90 days</span></div>
    <div class="grid3" style="margin-bottom:10px"><div><div class="mu">Now</div><div class="big">${cur ? round(num(cur.lbs),1) : '—'}</div></div><div><div class="mu">Lost</div><div class="big">${cur ? lost : '—'}</div></div><div><div class="mu">To go</div><div class="big">${toGo !== null ? Math.max(0,toGo) : '—'}</div></div></div>
    <div class="prog">${bar(pct, 100, 'var(--ac)')}</div><div class="note">${round(pct)}% of the way from ${st.startWeight} to ${st.goalWeight} lb${rate !== null ? ` · ${rate > 0 ? '+' : ''}${round(rate,1)} lb/week (last 4 weeks)` : ''}</div>
    ${proj ? `<div class="note">${proj}</div>` : ''}
    <div style="margin-top:10px">${lineChart([{pts:recent.map(w => ({x:dnum(w.date), y:num(w.lbs)})), color:'#7a8292', dots:true, w:1, op:.8}, {pts:avgPts, color:'var(--ac)', w:2.5}], {goal: recent.length ? st.goalWeight : null, h:180})}</div>
    <div class="legend"><span><i style="background:#7a8292"></i>Daily</span><span><i style="background:var(--ac)"></i>7-day average</span></div></div>`;

  h += calendarCard(S.calMonth || t.slice(0, 7), true);
  h += balanceCard();

  // food 14 days
  const days14 = Array.from({length:14}, (_, i) => addDays(t, i-13));
  const foods = all('food');
  const byDay = days14.map(d => sumFood(foods.filter(f => f.date === d)));
  const logged = byDay.filter(x => x.cal > 0);
  const avgCal = logged.length ? logged.reduce((a,b)=>a+b.cal,0)/logged.length : 0;
  const avgP = logged.length ? logged.reduce((a,b)=>a+b.p,0)/logged.length : 0;
  const dl = d => parseYmd(d).toLocaleDateString(undefined, {weekday:'narrow'});
  h += `<div class="card"><div class="ch"><h3>Calories</h3><span class="mu">Last 14 days</span></div>
    ${barChart(days14.map((d,i) => ({label:dl(d), v:byDay[i].cal})), {target:st.calTarget, overWarn:true})}
    <div class="note">Average ${logged.length ? fmt(avgCal) : '—'} cal · ${logged.length ? fmt(avgP) : '—'} g protein on ${logged.length} logged day${logged.length===1?'':'s'}</div></div>`;

  // sleep
  const sleeps = days14.map(d => sleepTotal(d));
  const sl = sleeps.filter(v => v > 0);
  h += `<div class="card"><div class="ch"><h3>Sleep</h3><span class="mu">Last 14 days</span></div>
    ${barChart(days14.map((d,i) => ({label:dl(d), v:sleeps[i]})), {target:st.sleepTarget, color:'var(--pur)', dec:1})}
    <div class="note">Average ${sl.length ? round(sl.reduce((a,b)=>a+b,0)/sl.length, 1) + ' hrs' : '—'} on ${sl.length} logged day${sl.length===1?'':'s'}, naps included</div></div>`;

  // strength
  const all_ = workouts();
  const names = [...new Set(all_.flatMap(w => (w.exercises||[]).filter(e => !CARDIO.has(e.name) && (e.sets||[]).some(s => num(s.w) > 0 && num(s.r) > 0)).map(e => e.name)))];
  if (!S.progEx || !names.includes(S.progEx)) S.progEx = names.includes('Deadlift') ? 'Deadlift' : names[0] || null;
  h += `<div class="card"><div class="ch"><h3>Strength</h3></div>`;
  if (S.progEx) {
    const n = S.progEx.toLowerCase();
    const pts = all_.map(w => { let b = 0; (w.exercises||[]).forEach(e => { if ((e.name||'').toLowerCase() === n) (e.sets||[]).forEach(s => { b = Math.max(b, e1rm(num(s.w), num(s.r))); }); }); return b ? {x:dnum(w.date), y:round(b)} : null; }).filter(Boolean);
    const first = pts[0], lastp = pts[pts.length-1];
    h += `<select data-c="progEx">${names.map(x => `<option ${x===S.progEx?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <div style="margin-top:10px">${lineChart([{pts, color:'var(--blue)', dots:true, w:2.5, r:3}], {h:170})}</div>
      <div class="note">Estimated 1-rep max per session${pts.length > 1 ? ` · ${lastp.y - first.y >= 0 ? '+' : ''}${lastp.y - first.y} lb since ${fmtDate(new Date(first.x) && ymd(new Date(first.x)), {month:'short', day:'numeric'})}` : ''}</div>`;
  } else h += '<div class="empty">Log a workout with weights to see strength trends.</div>';
  h += `</div>`;

  // workouts per week
  const monday = s => { const d = parseYmd(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); };
  const wk0 = monday(t), weeks = Array.from({length:8}, (_, i) => addDays(wk0, (i-7)*7));
  const counts = weeks.map(w => all_.filter(x => x.date >= w && x.date < addDays(w, 7)).length);
  h += `<div class="card"><div class="ch"><h3>Workouts per week</h3><span class="mu">Last 8 weeks</span></div>
    ${barChart(weeks.map((w,i) => ({label:parseYmd(w).toLocaleDateString(undefined,{month:'numeric', day:'numeric'}), v:counts[i]})), {color:'var(--blue)', h:120})}</div>`;
  h += insightCard();
  return h;
};

/* ---------- body parts ---------- */

async function aiWorkout(){
  const w = S.wo, desc = (w.desc || '').trim();
  if (!S.sample || w.busy) return;
  if (!desc) return toast('Say or type what you did first.');
  w.busy = true; renderModal();
  const prompt = `You turn a spoken description of a gym workout into a structured log. It may come from voice dictation, so expect missing punctuation and misheard words.
Workout date: ${w.date}. Current time: ${nowHM()}.
Description: <<${desc.slice(0, 1500)}>>
It may describe just the one exercise they finished, or a whole workout. Already logged today: ${w.exercises.map(e => e.name).join(', ') || 'nothing yet'}.
Known exercise names (use one of these exact names when it matches; otherwise use a short clear name): ${exNames().join(', ')}.
Body part keys (use only these): ${PARTS.map(p => p[0]).join(', ')}.
Weights are in pounds. "3 sets of 10 at 135" means three sets, each 135 lb for 10 reps. If no weight is said (bodyweight), use 0. If a time like "started at 6" is said, convert it to 24-hour HH:MM using common sense (evening gym time if ambiguous). If a length like "an hour and a half" is said with only a start or an end, work out the other time.
Reply with JSON only: {"name": "short workout name like 'Back & chest'", "start": "HH:MM" or null, "end": "HH:MM" or null, "parts": [body part keys trained], "exercises": [{"name": string, "sets": [{"w": number, "r": number}]}], "notes": "anything else said that is worth keeping, else empty string"}`;
  try {
    const r = await S.sample.json(prompt, {modelTier:'default'});
    if (!r || typeof r !== 'object') throw new Error('bad');
    if (S.wo !== w) return;
    const added = [];
    const hm = v => typeof v === 'string' && /^\d{1,2}:\d{2}$/.test(v) ? v.padStart(5, '0') : null;
    if (hm(r.start)) w.start = hm(r.start);
    if (hm(r.end)) w.end = hm(r.end);
    (Array.isArray(r.parts) ? r.parts : []).forEach(p => { if (PART_LBL[p] && !w.parts.includes(p)) w.parts.push(p); });
    (Array.isArray(r.exercises) ? r.exercises : []).forEach(e => {
      if (!e || !e.name) return;
      const name = exNames().find(n => n.toLowerCase() === String(e.name).toLowerCase()) || String(e.name).slice(0, 40);
      const sets = (Array.isArray(e.sets) ? e.sets : []).slice(0, 20).map(s => ({w: num(s.w) || '', r: num(s.r) || ''})).filter(s => s.r !== '' || s.w !== '');
      const ex = w.exercises.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (ex) { if (sets.length) { ex.sets = sets; ex.each = false; } } else w.exercises.push({name, sets: sets.length ? sets : [{w:'', r:''}]});
      addPartsFor(name); added.push(name);
    });
    if (r.notes) w.notes = [w.notes, String(r.notes).slice(0, 500)].filter(Boolean).join('\n');
    w.name = autoName(w.parts) || w.name; w.desc = ''; S.voiceText = ''; saveWo(0); toast(added.length ? `Logged: ${[...new Set(added)].join(', ')}` : 'Got it');
  } catch(e) {
    if (e && e.code === 'not_granted') { S.sample = null; toast('AI isn’t available here.'); }
    else if (e && e.code === 'rate_limited') toast('Too many requests — wait a minute.');
    else toast('Couldn’t read that. Try again or add it by hand.');

}

function dayWorkout(d){ return workouts().filter(w => w.date === d)[0] || null; }
function mergeInto(base, others){
  const w = JSON.parse(JSON.stringify(base));
  w.parts = [...new Set([...(w.parts || []), ...others.flatMap(o => o.parts || [])])];
  const filled = e => (e.sets || []).filter(x => num(x.r) > 0 || num(x.w) > 0).length;
  const byName = new Map();
  [w, ...others].flatMap(o => o.exercises || []).forEach(e => { const k = (e.name || '').toLowerCase(), cur = byName.get(k); if (!cur || filled(e) > filled(cur)) byName.set(k, e); });
  w.exercises = [...byName.values()];
  w.notes = [w.notes, ...others.map(o => o.notes)].filter(Boolean).join('\n');
  const st = [w, ...others].map(o => o.start).filter(Boolean).sort(), en = [w, ...others].map(o => o.end).filter(Boolean).sort();
  w.start = st[0] || ''; w.end = en[en.length - 1] || '';
  w.name = autoName(w.parts) || w.name || others.map(o => o.name).find(Boolean) || '';
  return w;
}
function mergeDayDupes(){
  const groups = {};
  workouts().forEach(w => (groups[w.date] = groups[w.date] || []).push(w));
  let n = 0;
  Object.values(groups).forEach(g => {
    if (g.length < 2) return;
    g.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const [base, ...rest] = g, {id, ...merged} = mergeInto(base, rest);
    put(base.id, merged); rest.forEach(o => del(o.id)); n += rest.length;
  });
  if (n) toast(`Combined ${n} extra workout${n > 1 ? 's' : ''} so each day has one`);
}

async function shrink(file, max = 1024){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.82));
  } catch(e) { return file; }

function mv(m, k){

  return 0;
}

  quickFood: a => { const f = S.docs.get(a.dataset.id); if (!f) return; const m = guessMeal(); put('f_'+uid36(), {kind:'food', date:S.date, meal:m, name:f.name, cal:num(f.cal), p:num(f.p), c:num(f.c), f:num(f.f), ts:Date.now()}); toast(`Added ${f.name} to ${m}`); },
  aiEst: () => aiEstimate(),
  clearImg: () => { S.food.img = null; S.food.imgUrl = null; renderModal(); },
  saveFood: () => {
    const f = S.food; if (!f.name.trim()) return toast('Give the food a name.');
    const old = S.foodId ? S.docs.get(S.foodId) : null;
    const id = S.foodId || 'f_' + uid36();
    put(id, {kind:'food', date: old ? old.date : S.date, meal:f.meal, name:f.name.trim(), cal:num(f.cal), p:num(f.p), c:num(f.c), f:num(f.f), ts: old ? old.ts : Date.now()});
    toast(S.foodId ? 'Saved' : `Added to ${f.meal}`); closeModal();
  },
  delFood: a => { if (armDelete(a)) { del(S.foodId); closeModal(); } },
  newWo: () => { S.tab = S.tab === 'today' ? 'today' : 'lift'; newWorkout(false); },
  repeatWo: () => newWorkout(true),
  openWo: a => openWorkout(a.dataset.id),
  finishWo: () => finishWo(),
  delWo: a => { if (armDelete(a)) { del(S.woId); S.wo = null; closeModal(); toast('Workout deleted'); } },
  rest: a => startRest(+a.dataset.v),
  part: a => { const p = a.dataset.v, ps = S.wo.parts; const i = ps.indexOf(p); if (i >= 0) ps.splice(i, 1); else ps.push(p); a.classList.toggle('on', i < 0); S.wo.name = autoName(ps); const wn = $('#woName'); if (wn) wn.textContent = S.wo.name || 'Workout'; saveWo(); const ep = $('#exPick'); if (ep) ep.innerHTML = exPickHtml(); },
  woNow: a => { S.wo[a.dataset.k] = nowHM(); saveWo(0); renderModal(); },
  offDay: () => { const d = dayDoc(S.date); d.off = !d.off; put('d_'+S.date, d); toast(d.off ? 'Rest day logged 😴' : 'Rest day removed'); },
  calDay: a => { S.pickDay = a.dataset.v; openModal('dayPick'); },
  dpPart: a => {
    const ds = S.pickDay, p = a.dataset.v; let w = dayWorkout(ds), id = w ? w.id : 'wo_' + uid36();
    w = w ? JSON.parse(JSON.stringify(w)) : {kind:'workout', date:ds, ts:Date.now(), name:'', exercises:[], parts:[]};
    delete w.id; w.parts = w.parts || [];
    const i = w.parts.indexOf(p); if (i >= 0) w.parts.splice(i, 1); else w.parts.push(p);
    w.name = autoName(w.parts);
    if (!w.parts.length && !(w.exercises || []).length) del(id); else put(id, w);
    const dd = S.docs.get('d_'+ds); if (dd && dd.off && w.parts.length) put('d_'+ds, {...dd, off:false});
    renderModal();
  },
  dpRest: () => {
    const ds = S.pickDay, w = dayWorkout(ds), dd = {kind:'daily', date:ds, ...(S.docs.get('d_'+ds) || {})};
    if (!dd.off && w) { if ((w.exercises || []).length) return toast('This day has exercises logged — open it to remove them first.'); del(w.id); }
    dd.off = !dd.off; put('d_'+ds, dd); renderModal();
  },
  dpFull: () => { const ds = S.pickDay; S.date = ds; const w = dayWorkout(ds); if (w) openWorkout(w.id); else newWorkout(false); },
  foodDay: a => { S.date = a.dataset.v; render(); window.scrollTo(0, 0); },
  balSpan: a => { S.balSpan = +a.dataset.v; render(); },
  calMonth: a => { S.calMonth = a.dataset.v; render(); },
  aiWo: () => { S.voiceType = false; aiWorkout(); },
  voice: () => voiceToggle(),
  voiceClose: () => { S.voiceType = false; renderModal(); },
  mealRetry: () => { const j = S.mealJob; if (j) photoMeal(j.meal, j.blob); },
  mealManual: () => { const j = S.mealJob; S.mealJob = null; openFood(j ? j.meal : guessMeal()); },
  insights: () => runInsights(),
  otherEx: () => { S.showOther = true; $('#exPick').innerHTML = exPickHtml(); const i = $('#exIn'); if (i) i.focus(); },
  pickEx: a => {
    const name = a.dataset.v, idx = S.wo.exercises.findIndex(e => e.name === name);
    if (idx >= 0) {
      if (S.wo.exercises[idx].sets.some(s => num(s.r) > 0 && !lastTimeFor(name, S.woId))) return toast('It has sets logged — use Remove on it below.');
      S.wo.exercises.splice(idx, 1);
    } else {
      const lt = lastTimeFor(name, S.woId), top = lt ? lt.sets[0] : null;
      const nn = lt ? Math.min(lt.sets.length, 10) : (CARDIO.has(name) ? 1 : 3);
      S.wo.exercises.push({name, sets:Array.from({length:nn}, () => ({w: top ? top.w : '', r: top ? top.r : (CARDIO.has(name) ? 20 : 10)}))});
      toast(`${name} added — enter your sets below`);
    }
    saveWo(0); renderModal();
  },
  mic: () => { const d = S.dict; if (!d) return; if (listening) { d.stop().catch(()=>{}); return; } d.start().catch(e => { if (e && e.code === 'not_granted') { S.dict = null; renderModal(); toast('Microphone not allowed — use the keyboard mic instead.'); } }); },
  install: () => doInstall(),
  doImportOld: () => doImportOld(),
  signOut: async () => { flushAll(); try { await sb.auth.signOut(); } catch(e) {} location.reload(); },
  metric: a => { S.crewMetric = a.dataset.v; render(); },
  member: a => { S.memberId = a.dataset.id; openModal('member'); },
  editMe: () => openModal('me'),
  joinCrew: async () => {
    const name = ($('#crewName').value || '').trim(); if (!name) return toast('Add your name first.');
    S.busy = true; render();
    try {
      await writeMe({name, avatar:S.joinAvatar || null, shareLost:true, joined:Date.now()});
      toast('You’re in the crew');
    } catch(e) { toast('Couldn’t join — try again.'); }
    S.busy = false; S.joinAvatar = null; S.joinAvatarUrl = null; render();
  },
  postPic: async () => {
    const p = S.pic; if (!p || p.busy) return;
    p.busy = true; renderModal();
    try {
      const id = await uploadImg(p.blob);
      await S.db.collection(`crew/${S.uid}/pics`).doc('p_' + uid36()).set({asset:id, caption:(p.caption||'').trim().slice(0,140), ts:Date.now()});
      toast('Posted'); S.pic = null; closeModal();
    } catch(e) { console.error(e); p.busy = false; renderModal(); toast(e && e.code === 'quota_exceeded' ? 'Photo storage is full.' : 'Couldn’t post — try again.'); }
  },
  delPic: async a => {
    if (!armDelete(a)) return;
    try { await S.db.doc(`crew/${S.uid}/pics/${a.dataset.id}`).delete(); try { await S.assets.delete(a.dataset.asset); } catch(_) {} toast('Photo deleted'); } catch(e) { toast('Couldn’t delete — try again.'); }
    renderModal();
  },
  saveMe: () => {
    const name = ($('#meName').value || '').trim(); if (!name) return toast('Name can’t be empty.');
    writeMe({name, shareLost: $('#meLost').checked}); toast('Saved'); closeModal();
  },
  leaveCrew: async a => {
    if (!armDelete(a)) return;
    const pics = S.pics.get(S.uid) || [];
    try {
      for (const p of pics) { await S.db.doc(`crew/${S.uid}/pics/${p.id}`).delete(); try { await S.assets.delete(p.asset); } catch(_) {} }
      await crewChain; await S.db.doc('crew/' + S.uid).delete(); lastCrew = '';
      toast('You left the crew'); closeModal();
    } catch(e) { toast('Couldn’t leave — try again.'); }
  },
  addEx: a => {
    const inp = $('#exIn'); const name = (a.dataset.v || (inp && inp.value) || '').trim(); if (!name) return toast('Type an exercise name.');
    const match = exNames().find(n => n.toLowerCase() === name.toLowerCase()) || name;
    if (!exNames().includes(match)) { const st = settings(); put('settings', {...st, kind:'settings', customExercises:[...(st.customExercises||[]), match]}); }
    const lt = lastTimeFor(match, S.woId), top = lt ? lt.sets[0] : null;
    S.wo.exercises.push({name:match, sets:[{w: top ? top.w : '', r: top ? top.r : ''}]}); addPartsFor(match);
    saveWo(0); renderModal();
    const sh = $('#modal .sheet'); if (sh) sh.scrollTop = sh.scrollHeight;
  },
  rmEx: a => { if (!armDelete(a)) return; S.wo.exercises.splice(+a.dataset.i, 1); saveWo(0); renderModal(); },
  addSet: a => { const ex = S.wo.exercises[+a.dataset.i]; const l = ex.sets[ex.sets.length-1] || {w:'', r:''}; ex.sets.push({w:l.w, r:l.r}); saveWo(); renderModal(); },
  qstep: a => { const i = +a.dataset.i, k = a.dataset.k, ex = S.wo.exercises[i], f = ex.sets[0] || {w:'', r:''}; const cur = k === 'n' ? ex.sets.length : num(f[k]); setQuick(i, k, Math.max(k === 'n' ? 1 : 0, cur + num(a.dataset.v))); saveWo(); renderModal(); },
  eachSet: a => { S.wo.exercises[+a.dataset.i].each = true; renderModal(); },
  sameSets: a => { const ex = S.wo.exercises[+a.dataset.i]; ex.each = false; const f = ex.sets[0] || {w:'', r:''}; ex.sets = ex.sets.map(() => ({w:f.w, r:f.r})); saveWo(); renderModal(); },
  rmSet: a => { const ex = S.wo.exercises[+a.dataset.i]; ex.sets.splice(+a.dataset.j, 1); saveWo(); renderModal(); },
  saveSettings: () => {
    const st = settings();
    document.querySelectorAll('[data-st]').forEach(i => { const v = num(i.value); if (v > 0) st[i.dataset.st] = v; });
    put('settings', {...st, kind:'settings'}); toast('Goals saved'); closeModal();
  },
  copyExport: async () => {
    const txt = JSON.stringify({app:'health-tracker', v:1, exported:new Date().toISOString(), docs:Object.fromEntries(S.docs)});
    try { await navigator.clipboard.writeText(txt); toast('Backup copied — paste it somewhere safe.'); }
    catch(e) { const t = $('#impIn'); if (t) { t.value = txt; t.select(); } toast('Copy blocked — the backup is in the box below; select and copy it.'); }
  },
  doImport: async a => {
    let o; try { o = JSON.parse($('#impIn').value); } catch(e) { return toast('That doesn’t look like a backup.'); }
    const docs = o && o.docs; if (!docs || typeof docs !== 'object') return toast('That doesn’t look like a backup.');
    a.disabled = true; a.textContent = 'Restoring…';
    const ids = Object.keys(docs).filter(id => /^[A-Za-z0-9_\-.~:@+]+$/.test(id) && docs[id] && typeof docs[id] === 'object');
    if (S.mode === 'cloud') {
      let n = 0;
      for (const id of ids) { try { await S.col.doc(id).set(docs[id]); n++; } catch(e) { console.error(e); } }
      toast(`Restored ${n} entries`);
    } else { ids.forEach(id => S.docs.set(id, docs[id])); saveLocal(); render(); toast(`Restored ${ids.length} entries`); }
    closeModal();
  }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.closest('.it') && a.classList.contains('x')) e.stopPropagation();
  const f = A[a.dataset.a]; if (f) f(a, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.wo && S.wo) { S.wo[t.dataset.wo] = t.value; if (t.dataset.wo === 'desc') return; saveWo(); if (t.dataset.wo === 'start' || t.dataset.wo === 'end') { const d = $('#woDur'); if (d) d.textContent = durTxt(woMins(S.wo)); } }
  else if (t.dataset.q && S.wo) { const [i, k] = t.dataset.q.split(','); setQuick(+i, k, t.value); saveWo(); }
  else if (t.dataset.set && S.wo) {
    const [i, j, k] = t.dataset.set.split(','); const s = S.wo.exercises[+i].sets[+j];
    s[k] = t.value === '' ? '' : num(t.value);
    const c = $(`#e_${i}_${j}`); if (c) { const v = CARDIO.has(S.wo.exercises[+i].name) ? 0 : e1rm(num(s.w), num(s.r)); c.textContent = v ? round(v) : ''; }
    saveWo();
  }
  else if (t.dataset.fd && S.food) S.food[t.dataset.fd] = t.value;
  else if (t.dataset.pc && S.pic) S.pic.caption = t.value;
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.c === 'steps') { const d = dayDoc(S.date); d.steps = Math.max(0, Math.round(num(t.value))); put('d_'+S.date, d); }
  else if (t.dataset.c === 'notes') { const d = dayDoc(S.date); d.notes = t.value; put('d_'+S.date, d); }
  else if (t.dataset.c === 'progEx') { S.progEx = t.value; t.blur(); render(); }
  else if (t.dataset.file === 'mealpic' && t.files && t.files[0]) {
    const meal = t.dataset.meal || guessMeal(), blob = await shrink(t.files[0], 1024); t.value = '';
    photoMeal(meal, blob);
  }
  else if (t.dataset.file === 'pic' && t.files && t.files[0]) {
    const blob = await shrink(t.files[0], 1440); t.value = '';
    S.pic = {blob, url:URL.createObjectURL(blob), caption:'', busy:false}; openModal('pic');
  }
  else if ((t.dataset.file === 'joinAvatar' || t.dataset.file === 'meAvatar') && t.files && t.files[0]) {
    const blob = await shrink(t.files[0], 400), which = t.dataset.file; t.value = '';
    S.busy = true; which === 'meAvatar' ? renderModal() : render();
    try {
      const id = await uploadImg(blob);
      if (which === 'joinAvatar') { S.joinAvatar = id; S.joinAvatarUrl = URL.createObjectURL(blob); }
      else { await writeMe({avatar:id}); toast('Photo updated'); }
    } catch(e) { console.error(e); toast('Couldn’t upload the photo — try again.'); }
    S.busy = false; which === 'meAvatar' ? renderModal() : render();
  }
  else if (t.dataset.file && t.files && t.files[0] && S.food) {
    const f = S.food, blob = await shrink(t.files[0]);
    f.img = blob; f.imgUrl = URL.createObjectURL(blob); renderModal();
  }
});

init();
</script>
</body>
</html>
